name: Deploy API

# Solo corre tras un push a main (es decir, después de que CI ya pasó en el PR
# correspondiente). Construye la imagen de producción, la publica en GHCR,
# aplica las migraciones de Prisma y dispara el deploy hook de Render.
# El frontend se despliega aparte, vía la integración nativa de Vercel con GitHub.
# Ver docs/diagramas/DIA-05-pipeline-cicd.md y docs/05-modelos-cloud.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/esencia-api:latest
            ghcr.io/${{ github.repository_owner }}/esencia-api:${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias de la API (para prisma migrate)
        working-directory: apps/api
        run: npm install --omit=dev

      - name: Aplicar migraciones en producción
        working-directory: apps/api
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Disparar el deploy hook de Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
